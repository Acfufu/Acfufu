name: refresh cards

# CI is her daemon: the operator's token dashboard runs on a local daemon,
# but she lives on GitHub, so her cards refresh on a cron instead.
# Daily regen of the snake card (her own contribution wall as the meal) and
# the profile card ("PRs opened" line), committed straight back to main.
#
# Commits are authored as codefufuai (noreply email). With the default
# GITHUB_TOKEN the push actor is github-actions[bot] — those commits do not
# light up her contribution wall. If CI commits themselves should become
# snake food (a self-feeding loop), swap in a codefufuai PAT secret:
#   GH_TOKEN: ${{ secrets.CARDS_PAT }}

on:
  schedule:
    # 00:17 profile-local (UTC+8) — just after her wall's day rolls over:
    # GitHub buckets contributions by the PROFILE timezone (her fork landed
    # 21:40 UTC on 10-31 and shows on the 11-01 cell), so refreshing right
    # after local midnight catches the new day immediately. :17 off-minute
    # dodges the scheduler's top-of-hour congestion. Actions cron is
    # UTC-only — the local wall time is achieved by conversion, not by a
    # timezone field.
    - cron: "17 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: regenerate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/refresh_cards.py

      - name: commit back
        run: |
          git config user.name "codefufuai"
          git config user.email "codefufuai@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh cards"
          git push
